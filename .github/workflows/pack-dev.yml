# Run the actual npm tarball packaging command on every PR and main update.
# Standard GitHub-hosted Linux runner; no artifacts uploaded, no npm publish.
name: NextGuide pack:dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Build and package (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install workspace dependencies
        run: bun install
      - name: Build, test, and pack the NextGuide npm package
        # Exercise the same forced-ANSI environment that exposed Windows-only test failures.
        env:
          FORCE_COLOR: "1"
        run: bun run pack:dev
      - name: Verify installed Account Mode consumer (Cache Components, TOTP, CMS)
        if: github.event_name == 'pull_request'
        run: bun run compat:account
      # The same packaged App/Pages Router smoke builds used by GitHub Pages.
      # Run on PRs only; official docs deployment remains manual.
      - name: Smoke-build installed NextGuide in App and Pages Router
        if: github.event_name == 'pull_request'
        run: bun run compat:next
      # The official Pages workflow must not be the first place we discover
      # broken MDX/prerendering or invalid exported links.
      - name: Build and verify official App Router docs for GitHub Pages
        if: github.event_name == 'pull_request'
        env:
          NEXTGUIDE_PAGES: "1"
          NEXT_PUBLIC_NEXTGUIDE_SITE_URL: "https://m1nsook.github.io/NextGuide"
        run: |
          bun run build:web
          node --test scripts/verify-official-links.test.mjs
          node scripts/verify-official-links.mjs apps/web/out
      - name: Remove generated package archives
        if: always()
        shell: bash
        run: |
          # The package is created only to verify packaging. Never upload it.
          find . -maxdepth 1 -type f -name 'nextguide-*.tgz' -delete
