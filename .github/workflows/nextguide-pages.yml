name: NextGuide Docs (GitHub Pages)

# Auto-deploy official App Router docs after relevant main-branch changes.
# PRs are build-tested by pack:dev; Pages deployment is never run on PRs.
# Path filters avoid spending runner minutes on unrelated code changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nextguide-pages.yml"
      - "apps/web/**"
      - "packages/nextguide/src/components/**"
      - "packages/nextguide/src/mdx/**"
      - "packages/nextguide/src/ui/**"
      - "packages/nextguide/src/blocks/**"
      - "packages/nextguide/src/og/**"
      - "packages/nextguide/src/fonts/**"
      - "packages/nextguide/src/icons/**"
      - "packages/nextguide/src/openapi/**"
      - "packages/nextguide/src/core/**"
      - "packages/nextguide/lib/starter-templates.mjs"
      - "packages/nextguide/lib/starter-content.mjs"
      - "packages/nextguide/package.json"
      - "scripts/verify-official-links.mjs"
      - "scripts/verify-generated-starter.mjs"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: nextguide-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXTGUIDE_PAGES: "1"
      NEXT_PUBLIC_NEXTGUIDE_SITE_URL: "https://m1nsook.github.io/NextGuide"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install

      - name: Test full NextGuide package and CLI
        run: bun run --cwd packages/nextguide test

      - name: Test NextGuide component behavior
        run: bun run --cwd packages/nextguide test:unit

      - name: Smoke-build packed NextGuide in fresh App/Pages Router consumers
        run: node scripts/verify-generated-starter.mjs

      - name: Build NextGuide documentation
        run: bun run build:web

      - name: Test GitHub Pages link verifier
        run: node --test scripts/verify-official-links.test.mjs

      - name: Verify every exported documentation link
        run: node scripts/verify-official-links.mjs apps/web/out

      - name: Keep Next.js assets intact on Pages
        if: github.event_name != 'pull_request'
        run: touch apps/web/out/.nojekyll

      # Keep only short-lived deployment archives; never store old site builds.
      # upload-pages-artifact already defaults to one day. Make the policy explicit.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
