name: NextGuide Docs (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextguide-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXTGUIDE_PAGES: "1"
      NEXT_PUBLIC_NEXTGUIDE_SITE_URL: "https://m1nsook.github.io/NextGuide"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install

      - name: Test full NextGuide package and CLI
        run: bun run --cwd packages/nextguide test

      - name: Test NextGuide component behavior
        run: bun run --cwd packages/nextguide test:unit

      - name: Smoke-build packed NextGuide in fresh App/Pages Router consumers
        run: node scripts/verify-generated-starter.mjs

      - name: Build NextGuide documentation
        run: bun run build:web

      - name: Keep Next.js assets intact on Pages
        if: github.event_name != 'pull_request'
        run: touch apps/web/out/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
