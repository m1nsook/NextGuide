# A separate trusted workflow can create issues even for fork PRs.
# No checkout, no execution of PR code, and no downloaded artifacts.
# The report is written using the completed run's job logs API.
name: Report NextGuide pack:dev

on:
  workflow_run:
    workflows: ["NextGuide pack:dev"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  report:
    name: Create build result issue
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: File a pass or fail issue (include failing job log)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BUILD_RESULT: ${{ github.event.workflow_run.conclusion }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
          BUILD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BUILD_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          node --input-type=module <<'NODE'
          const {
            GH_TOKEN: token,
            GITHUB_REPOSITORY: repository,
            BUILD_RUN_ID: runId,
            BUILD_ATTEMPT: attempt,
            BUILD_RESULT: result,
            BUILD_URL: runUrl,
            BUILD_COMMIT: commit,
            BUILD_BRANCH: branch,
            BUILD_EVENT: event,
          } = process.env

          if (!token || !repository || !/^\d+$/.test(runId || "")) {
            throw new Error("Missing GitHub issue reporting context")
          }
          const api = `https://api.github.com/repos/${repository}`
          const headers = {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "nextguide-pack-reporter",
          }
          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...options.headers } })
            if (!response.ok) {
              throw new Error(`GitHub API request failed (${response.status}): ${(await response.text()).slice(0, 500)}`)
            }
            return response
          }

          const id = Number(runId)
          const summary = [
            `## NextGuide package build: ${result.toUpperCase()}`,
            "",
            `- **Run:** [#${id}, attempt ${attempt}](${runUrl})`,
            `- **Commit:** \`${commit}\``,
            `- **Branch:** \`${branch}\``,
            `- **Trigger:** \`${event}\``,
            "- **Runner:** `ubuntu-latest` (standard)",
            "- **Command:** `bun run pack:dev`",
            "- **npm publishing:** disabled",
            "- **Package artifact:** deleted on runner; never uploaded or retained",
          ]

          if (result === "failure") {
            summary.push("", "The package build failed. Review the relevant log below and the full Actions run.")

            try {
              // GitHub may still be finalizing the logs immediately after completion.
              // Retry briefly instead of creating a failure issue with no compiler output.
              let raw = ""
              let latestError
              for (let retry = 0; retry < 6; retry++) {
                try {
                  const jobsResponse = await request(`${api}/actions/runs/${id}/attempts/${Number(attempt)}/jobs?per_page=100`)
                  const jobs = (await jobsResponse.json()).jobs || []
                  const failed = jobs.find(job => job.conclusion === "failure")
                  if (!failed) throw new Error("No failed job found in run attempt")
                  const logResponse = await request(`${api}/actions/jobs/${failed.id}/logs`)
                  raw = await logResponse.text()
                  if (raw.trim()) break
                  throw new Error("GitHub returned an empty job log")
                } catch (error) {
                  latestError = error
                  if (retry < 5) await new Promise(resolve => setTimeout(resolve, 2000))
                }
              }
              if (!raw.trim()) throw latestError || new Error("Could not fetch job log")
              const clean = raw.replace(/\u001b\[[0-9;]*[A-Za-z]/g, "").replace(/\r/g, "")
              const lines = clean.split("\n")
              const highlights = []
              for (let index = 0; index < lines.length; index++) {
                if (!/\bnot ok \d+\b|error TS\d+|##\[error\]|ERR_TEST_FAILURE/.test(lines[index])) continue
                highlights.push(lines.slice(Math.max(0, index - 2), Math.min(lines.length, index + 16)).join("\n"))
                if (highlights.join("\n...\n").length > 16000) break
              }
              const excerpt = highlights.join("\n...\n").slice(0, 16000)
              const tail = clean.slice(-12000)
              const limited = (excerpt ? "FAILURE EXCERPTS:\n" + excerpt + "\n\nEND OF JOB LOG:\n" : "") + tail
              const backticks = "`".repeat(Math.max(4, ...(limited.match(/`+/g) || []).map(s => s.length + 1)))
              summary.push("", "<details open><summary>Failing test/compiler excerpts and final job log</summary>",
                "", `${backticks}text`, limited || "(empty log)", backticks, "", "</details>")
            } catch (error) {
              summary.push("", `Could not retrieve the compilation log: ${String(error)}. Open the [Actions run](${runUrl}) to read it.`)
            }
          } else {
            summary.push("", "The package compiled, tests passed, and `npm pack` completed successfully.")
          }

          const title = `[pack:dev] ${result === "success" ? "PASS" : "FAIL"} — run #${id} (attempt ${attempt})`
          const response = await request(`${api}/issues`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, body: summary.join("\n") }),
          })
          const issue = await response.json()
          console.log(`Created build result issue: ${issue.html_url}`)
          NODE
